<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingram Micro power map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#17202B; --muted:#5E6B7A; --line:#CBD3DD; --line-soft:#E1E6EC;
  --accent:#0D6B6B; --accent-soft:#D7ECEB; --danger:#A33A2E;
  --f-exec:#2F3D63; --f-fin:#2F7D55; --f-proc:#7F4F99; --f-sc:#1E6FAE; --f-ops:#B97412; --f-log:#B0453A; --f-tech:#4D6B78; --f-sales:#7A7F87; --f-legal:#6F5C48;
  --shadow:0 1px 2px rgba(23,32,43,.06),0 2px 8px rgba(23,32,43,.05);
  --font:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11151B; --surface:#1A2029; --surface-2:#202733; --ink:#E5EAF0; --muted:#97A3B1; --line:#344050; --line-soft:#283140;
    --accent:#4FC1BC; --accent-soft:#173634; --danger:#E17A6D;
    --f-exec:#8DA0D6; --f-fin:#5DBE8A; --f-proc:#BC8FD6; --f-sc:#5AA7E4; --f-ops:#E1A54A; --f-log:#E07F72; --f-tech:#8DADBA; --f-sales:#A6ABB2; --f-legal:#BFA88E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11151B; --surface:#1A2029; --surface-2:#202733; --ink:#E5EAF0; --muted:#97A3B1; --line:#344050; --line-soft:#283140;
  --accent:#4FC1BC; --accent-soft:#173634; --danger:#E17A6D;
  --f-exec:#8DA0D6; --f-fin:#5DBE8A; --f-proc:#BC8FD6; --f-sc:#5AA7E4; --f-ops:#E1A54A; --f-log:#E07F72; --f-tech:#8DADBA; --f-sales:#A6ABB2; --f-legal:#BFA88E;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{display:flex;flex-direction:column;margin-right:8px;min-width:0}
.title h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.title span{font-size:12px;color:var(--muted)}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:20;max-height:340px;overflow:auto;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button.active{background:var(--accent-soft)}
.results small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B1A1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1A1A}}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:210px;z-index:30;display:none;padding:4px}
.menu-list.open{display:block}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-list button:hover{background:var(--surface-2)}
.menu-list hr{border:0;border-top:1px solid var(--line-soft);margin:4px 0}

/* Legend / filter strip */
.strip{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.strip .label{color:var(--muted);font-size:12px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font-weight:600;color:var(--muted)}
.stats{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted);padding-left:12px}
.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}

/* Main */
main{flex:1;display:flex;min-height:0;position:relative}
#canvas{flex:1;min-width:0;position:relative;overflow:hidden;cursor:grab}
#canvas.dragging{cursor:grabbing}
svg#chart{width:100%;height:100%;display:block}
.link{fill:none;stroke:var(--line);stroke-width:1.4}
.link.path{stroke:var(--accent);stroke-width:2.4}
.link.hover{stroke:var(--accent);stroke-width:2;opacity:.75}
.node .card{transition:stroke .15s}
.node.hover .card{stroke:var(--accent)}
.node .lift{transition:transform .15s}
.node.hover .lift{transform:translateY(-1px)}
.node{cursor:pointer}
.node .card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.node:hover .card{stroke:var(--muted)}
.node.selected .card,.node.selected:hover .card{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
.node.onpath .card{stroke:var(--accent)}
.node.dim{opacity:.22}
.node .name{font-size:13px;font-weight:600;fill:var(--ink)}
.node .role{font-size:11.5px;fill:var(--muted)}
.node .count{font-size:11px;font-weight:600;fill:var(--muted)}
.node .toggle{fill:var(--surface);stroke:var(--line)}
.node .toggle-hit{fill:transparent;cursor:pointer}
.node .toggle-glyph{font-size:12px;font-weight:700;fill:var(--muted);pointer-events:none}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;box-shadow:var(--shadow)}
.zoom{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:34px;height:34px;padding:0;font-size:16px}

/* Panel */
aside{width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;display:none;flex-direction:column}
aside.open{display:flex}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);position:relative}
.p-head h2{margin:0 28px 4px 0;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.p-head p{margin:0;color:var(--muted)}
.p-close{position:absolute;right:12px;top:12px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:6px}
.p-close:hover{background:var(--surface-2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft)}
.p-body{padding:14px 20px 24px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.field select,.field input[type=text],.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.field textarea{min-height:84px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0B1A1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0B1A1A}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.meta{font-size:13px;display:grid;grid-template-columns:96px 1fr;gap:6px 10px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;overflow-wrap:anywhere}
.meta a{color:var(--accent)}
.chain{display:flex;flex-direction:column;gap:2px}
.chain button{border:0;background:none;text-align:left;padding:3px 0;cursor:pointer;color:var(--accent);font-size:13px}
.chain button span{color:var(--muted)}
.error{color:var(--danger);font-size:12.5px;margin-top:4px;display:none}
.reports{font-size:13px;color:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:40;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(23,32,43,.14);padding:8px 10px;font-size:12.5px;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip strong{display:block;font-size:13px}
.tip span{color:var(--muted);display:block}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 6px}
.mix i{display:block;height:100%}
.mix-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.mix-legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.people{display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.people button{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line-soft);background:var(--surface);padding:7px 10px;cursor:pointer}
.people button:first-child{border-top:0}
.people button:hover{background:var(--surface-2)}
.people .sw{width:4px;align-self:stretch;border-radius:2px;flex:none}
.people .who{min-width:0}
.people .who strong{display:block;font-size:13px;font-weight:600}
.people .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people .n{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0 0;font-size:12.5px}
.sect h3{font-size:12.5px;font-weight:600;margin:0}
.known{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.known::before,.dotkey::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dotkey{display:inline-flex;align-items:center;gap:6px}
.fine{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){
  .bar{padding:8px 10px;gap:8px}
  .title span{display:none}
  .tools .btn.opt{display:none}
  .stats{display:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:70%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.15);z-index:15}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const STORE_KEY = 'powermap:ingram-micro:v1';
const FUNCS = [
  ['Executive Leadership','--f-exec'],['Finance','--f-fin'],['Procurement/Vendor','--f-proc'],['Supply Chain','--f-sc'],
  ['Operations','--f-ops'],['Logistics/Distribution','--f-log'],['Technology','--f-tech'],['Sales/Go-to-Market','--f-sales'],['Legal','--f-legal']];
const FCOLOR = Object.fromEntries(FUNCS);
const LEVELS = ['C-Suite','EVP/SVP','VP','Director','Manager','Individual Contributor'];

/* ---------- state ---------- */
let edits = {};
try { edits = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e) { edits = {}; }
const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const ROOT_ID = PEOPLE.find(p => !p.parent).id;
function get(id, k){ const e = edits[id]; return (e && k in e) ? e[k] : byId[id][k]; }
function parentOf(id){ return get(id,'parent'); }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(edits)); } catch(e) {} updateStats(); }
function setEdit(id, k, v){
  edits[id] = edits[id] || {};
  if (v === byId[id][k] || (v === '' && !byId[id][k])) delete edits[id][k]; else edits[id][k] = v;
  if (!Object.keys(edits[id]).length) delete edits[id];
  save();
}
let collapsed = new Set();
let activeFns = new Set(FUNCS.map(f => f[0]));
let selected = null;

function childrenMap(){
  const m = {}; PEOPLE.forEach(p => m[p.id] = []);
  PEOPLE.forEach(p => { const par = parentOf(p.id); if (par && m[par]) m[par].push(p.id); });
  const lv = id => LEVELS.indexOf(byId[id].level);
  Object.values(m).forEach(arr => arr.sort((a,b) => lv(a)-lv(b) || byId[a].fn.localeCompare(byId[b].fn) || byId[a].name.localeCompare(byId[b].name)));
  return m;
}
let KIDS = childrenMap();
function descendants(id){ const out=[]; const st=[...KIDS[id]]; while(st.length){ const x=st.pop(); out.push(x); st.push(...KIDS[x]); } return out; }
function ancestors(id){ const out=[]; let x=parentOf(id); while(x){ out.push(x); x=parentOf(x); } return out; }
function depthOf(id){ return ancestors(id).length; }

/* ---------- default view ---------- */
function setDefaultCollapse(){
  collapsed = new Set(PEOPLE.filter(p => KIDS[p.id].length && depthOf(p.id) >= 2).map(p => p.id));
  // open the path to people you're already talking to
  PEOPLE.forEach(p => { if (p.status) ancestors(p.id).forEach(a => collapsed.delete(a)); });
}
function leadersOnly(){
  collapsed = new Set(PEOPLE.filter(p => KIDS[p.id].length && (LEVELS.indexOf(p.level) >= 3 || KIDS[p.id].every(k => LEVELS.indexOf(byId[k].level) >= 4))).map(p => p.id));
}

/* ---------- chart ---------- */
const W = 248, H = 54, GAPX = 300, GAPY = 64;
const svg = d3.select('#chart'), vp = d3.select('#viewport');
const zoom = d3.zoom().scaleExtent([0.15, 2]).on('zoom', e => vp.attr('transform', e.transform))
  .on('start', () => document.getElementById('canvas').classList.add('dragging'))
  .on('end', () => document.getElementById('canvas').classList.remove('dragging'));
svg.call(zoom).on('dblclick.zoom', null);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let layout = null;

function buildTree(id){ const n = { id }; if (!collapsed.has(id) && KIDS[id].length) n.children = KIDS[id].map(buildTree); return n; }
function trunc(s, n){ return s.length > n ? s.slice(0, n-1) + '…' : s; }

let prevPos = {};
const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('aria-hidden','true'); document.body.appendChild(tip);
const linkPath = d3.linkHorizontal().x(d => d.y).y(d => d.x);
function linkD(s, t){ return linkPath({source:{x:s.x, y:s.y + W}, target:{x:t.x, y:t.y}}); }

function render(origin){
  KIDS = childrenMap();
  const root = d3.hierarchy(buildTree(ROOT_ID));
  d3.tree().nodeSize([GAPY, GAPX]).separation((a,b) => a.parent === b.parent ? 1 : 1.15)(root);
  layout = root;
  const pos = {}; root.each(d => pos[d.data.id] = {x:d.x, y:d.y});
  const pathSet = new Set(selected ? [selected, ...ancestors(selected)] : []);
  const dur = reduce ? 0 : 320;
  // where new nodes grow from, and where removed nodes shrink to
  const from = id => { if (prevPos[id]) return prevPos[id]; let a = parentOf(id); while (a && !prevPos[a]) a = parentOf(a); return (origin && prevPos[origin]) || (a && prevPos[a]) || pos[id]; };
  const to = id => { let a = parentOf(id); while (a && !pos[a]) a = parentOf(a); return (a && pos[a]) || prevPos[id]; };

  const links = vp.selectAll('path.link').data(root.links(), d => d.target.data.id);
  links.exit().transition().duration(dur).attr('d', d => { const p = to(d.target.data.id); return linkD(p, p); }).remove();
  const lEnter = links.enter().insert('path', 'g').attr('class','link').attr('d', d => { const p = from(d.target.data.id); return linkD(p, {x:p.x, y:p.y + W}); });
  lEnter.merge(links)
    .attr('class', d => 'link' + (pathSet.has(d.target.data.id) ? ' path' : ''))
    .transition().duration(dur).attr('d', d => linkD(d.source, d.target));

  const nodes = vp.selectAll('g.node').data(root.descendants(), d => d.data.id);
  nodes.exit().transition().duration(dur).style('opacity', 0).attr('transform', d => { const p = to(d.data.id); return `translate(${p.y},${p.x})`; }).remove();
  const enter = nodes.enter().append('g').attr('class','node').attr('tabindex',0).attr('role','button')
    .attr('transform', d => { const p = from(d.data.id); return `translate(${p.y},${p.x})`; }).style('opacity', 0);
  const lift = enter.append('g').attr('class','lift');
  lift.append('rect').attr('class','card').attr('width',W).attr('height',H).attr('y',-H/2).attr('rx',7);
  lift.append('rect').attr('class','bar').attr('width',4).attr('height',H-12).attr('x',6).attr('y',-H/2+6).attr('rx',2);
  lift.append('text').attr('class','name').attr('x',18).attr('y',-4);
  lift.append('text').attr('class','role').attr('x',18).attr('y',13);
  lift.append('circle').attr('class','status').attr('r',4.5).attr('cx',W-14).attr('cy',-H/2+13).attr('fill','var(--accent)');
  const tg = enter.append('g').attr('class','tgl');
  tg.append('rect').attr('class','toggle-hit').attr('x',W-2).attr('y',-14).attr('width',48).attr('height',28);
  tg.append('circle').attr('class','toggle').attr('cx',W+12).attr('r',10);
  tg.append('text').attr('class','toggle-glyph').attr('x',W+12).attr('y',4).attr('text-anchor','middle');
  tg.append('text').attr('class','count').attr('x',W+27).attr('y',4);

  const all = enter.merge(nodes);
  all.classed('selected', d => d.data.id === selected)
    .classed('onpath', d => pathSet.has(d.data.id) && d.data.id !== selected)
    .classed('dim', d => !activeFns.has(byId[d.data.id].fn))
    .attr('aria-label', d => `${byId[d.data.id].name}, ${byId[d.data.id].title}`)
    .transition().duration(dur).style('opacity', null).attr('transform', d => `translate(${d.y},${d.x})`);
  all.select('.bar').attr('fill', d => `var(${FCOLOR[byId[d.data.id].fn] || '--f-sales'})`);
  all.select('.name').text(d => trunc(byId[d.data.id].name, 28));
  all.select('.role').text(d => trunc(byId[d.data.id].title, 36));
  all.select('.status').style('display', d => byId[d.data.id].status ? null : 'none');
  all.select('.tgl').style('display', d => KIDS[d.data.id].length ? null : 'none')
    .attr('aria-label', d => (collapsed.has(d.data.id) ? 'Open ' : 'Close ') + byId[d.data.id].name + '’s team');
  all.select('.toggle-glyph').text(d => collapsed.has(d.data.id) ? '+' : '–');
  all.select('.count').text(d => collapsed.has(d.data.id) ? descendants(d.data.id).length : '');

  all.on('click', (e, d) => { e.stopPropagation(); select(d.data.id); })
     .on('dblclick', (e, d) => { e.stopPropagation(); if (KIDS[d.data.id].length) toggle(d.data.id); })
     .on('keydown', (e, d) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d.data.id); }
        if ((e.key === 'ArrowRight' && collapsed.has(d.data.id)) || (e.key === 'ArrowLeft' && !collapsed.has(d.data.id) && KIDS[d.data.id].length)) { e.preventDefault(); toggle(d.data.id); }
     })
     .on('mouseenter', (e, d) => hover(d.data.id, e))
     .on('mousemove', e => placeTip(e))
     .on('mouseleave', () => hover(null));
  all.select('.tgl').on('click', (e, d) => { e.stopPropagation(); toggle(d.data.id); })
     .on('mouseenter', e => e.stopPropagation());
  prevPos = pos;
}
function hover(id, e){
  const chain = id ? new Set([id, ...ancestors(id)]) : new Set();
  vp.selectAll('g.node').classed('hover', d => chain.has(d.data.id));
  vp.selectAll('path.link').classed('hover', d => chain.has(d.target.data.id));
  vp.selectAll('path.link.hover').raise();
  if (!id || window.matchMedia('(hover: none)').matches){ tip.classList.remove('show'); return; }
  const p = byId[id], n = descendants(id).length, par = parentOf(id);
  tip.innerHTML = `<strong>${esc(p.name)}</strong><span>${esc(p.title)}</span><span>${esc(p.city || '')}</span>${par ? `<span>Reports to ${esc(byId[par].name)}</span>` : ''}${n ? `<span>${n} ${n>1?'people':'person'} in their team</span>` : ''}`;
  tip.classList.add('show'); placeTip(e);
}
function placeTip(e){
  if (!e) return; const r = tip.getBoundingClientRect();
  let x = e.clientX + 16, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 16;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function toggle(id){ collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(id); }
function nodePos(id){ let f = null; layout.each(d => { if (d.data.id === id) f = d; }); return f; }
function centerOn(id, k){
  const d = nodePos(id); if (!d) return;
  const c = document.getElementById('canvas').getBoundingClientRect();
  const scale = k || Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  const sheet = window.innerWidth <= 760 && panel.classList.contains('open') ? panel.offsetHeight : 0;
  const t = d3.zoomIdentity.translate(c.width/2 - (d.y + W/2)*scale, (c.height - sheet)/2 - d.x*scale).scale(scale);
  (reduce ? svg : svg.transition().duration(450)).call(zoom.transform, t);
}
function fit(){
  if (!layout) return;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  layout.each(d => { x0=Math.min(x0,d.x); x1=Math.max(x1,d.x); y0=Math.min(y0,d.y); y1=Math.max(y1,d.y); });
  const c = document.getElementById('canvas').getBoundingClientRect();
  const w = y1 - y0 + W + 80, h = x1 - x0 + H + 60;
  const k = Math.min(1, Math.max(0.15, Math.min(c.width / w, c.height / h)));
  const t = d3.zoomIdentity.translate((c.width - w*k)/2 - (y0-40)*k, (c.height - h*k)/2 - (x0 - H/2 - 30)*k).scale(k);
  (reduce ? svg : svg.transition().duration(450)).call(zoom.transform, t);
}

/* ---------- selection & panel ---------- */
const panel = document.getElementById('panel');
function select(id, center){
  selected = id;
  ancestors(id).forEach(a => collapsed.delete(a));
  render(); renderPanel();
  if (center) centerOn(id);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function basisText(p){
  if (!p.parent) return 'Top of the chart.';
  if (/^Breeze/.test(p.basis)) return 'Reporting line suggested by HubSpot Breeze from job titles, then adjusted. Not confirmed.';
  return 'Reporting line inferred from job title and location (' + p.basis.charAt(0).toLowerCase() + p.basis.slice(1) + '). Not confirmed.';
}
function renderPanel(){
  if (!selected){ panel.classList.remove('open'); panel.innerHTML=''; return; }
  const p = byId[selected], id = selected, par = parentOf(id);
  const chain = ancestors(id).reverse(), kids = KIDS[id], all = descendants(id);
  const mix = {}; all.forEach(x => mix[byId[x].fn] = (mix[byId[x].fn]||0) + 1);
  const mixArr = FUNCS.filter(f => mix[f[0]]).map(f => [f[0], f[1], mix[f[0]]]);
  const known = byId[id].status;
  const SHOW = 8;
  const row = x => `<button data-go="${x}"><span class="sw" style="background:var(${FCOLOR[byId[x].fn]||'--f-sales'})"></span><span class="who"><strong>${esc(byId[x].name)}</strong><small>${esc(byId[x].title)}</small></span>${KIDS[x].length ? `<span class="n">${descendants(x).length}</span>` : ''}</button>`;
  panel.innerHTML = `
    <div class="p-head">
      <button class="p-close" id="pclose" aria-label="Close details">×</button>
      <h2>${esc(p.name)}</h2>
      <p>${esc(p.title)}</p>
      <div class="tags"><span class="tag" style="border-left:3px solid var(${FCOLOR[p.fn]||'--f-sales'})">${esc(p.fn)}</span><span class="tag">${esc(p.level)}</span>${known ? `<span class="known">${esc(known)}</span>` : ''}</div>
    </div>
    <div class="p-body">
      <dl class="meta">
        <dt>Reports to</dt><dd>${par ? `<a href="#" data-go="${par}">${esc(byId[par].name)}</a>` : 'Top of the chart'}</dd>
        <dt>Location</dt><dd>${esc(p.city || 'Not listed')}</dd>
        <dt>LinkedIn</dt><dd>${p.li ? `<a href="${esc(p.li)}" target="_blank" rel="noopener">Open profile</a>` : 'Not listed'}</dd>
      </dl>
      ${kids.length ? `<div class="sect"><h3>Team</h3>
        <div class="fine" style="margin-top:2px">${kids.length} direct report${kids.length>1?'s':''}, ${all.length} people in total</div>
        <div class="mix" aria-hidden="true">${mixArr.map(m => `<i style="width:${m[2]/all.length*100}%;background:var(${m[1]})" title="${esc(m[0])}: ${m[2]}"></i>`).join('')}</div>
        <div class="mix-legend">${mixArr.map(m => `<span><b style="background:var(${m[1]})"></b>${esc(m[0])} ${m[2]}</span>`).join('')}</div>
        <div class="people" id="kids">${kids.slice(0, SHOW).map(row).join('')}</div>
        ${kids.length > SHOW ? `<button class="more" id="moreKids">Show all ${kids.length} direct reports</button>` : ''}
      </div>` : ''}
      ${chain.length ? `<div class="sect"><h3>Reporting chain</h3>
        <div class="people">${chain.map(row).join('')}</div>
        <p class="fine" style="margin:8px 0 0">${esc(basisText(p))}</p></div>` : ''}
      <div class="field"><label for="note">Notes</label><textarea id="note" placeholder="Anything worth remembering about ${esc(p.name.split(' ')[0])}">${esc(get(id,'note') || '')}</textarea>
        <div class="help">Saved in this browser only.</div></div>
    </div>`;
  panel.classList.add('open');
  document.getElementById('pclose').onclick = () => { selected = null; renderPanel(); render(); };
  const wire = () => panel.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); select(b.dataset.go, true); });
  wire();
  const mk = document.getElementById('moreKids');
  if (mk) mk.onclick = () => { document.getElementById('kids').innerHTML = kids.map(row).join(''); mk.remove(); wire(); };
  const note = document.getElementById('note'); let t; note.oninput = () => { clearTimeout(t); t = setTimeout(() => setEdit(id,'note', note.value), 300); };
}
/* ---------- search ---------- */
const q = document.getElementById('q'), res = document.getElementById('results');
let hits = [], hi = 0;
function doSearch(){
  const s = q.value.trim().toLowerCase();
  if (!s){ res.classList.remove('open'); return; }
  hits = PEOPLE.filter(p => p.name.toLowerCase().includes(s) || p.title.toLowerCase().includes(s))
    .sort((a,b) => (b.name.toLowerCase().startsWith(s)) - (a.name.toLowerCase().startsWith(s)) || LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)).slice(0, 12);
  hi = 0;
  res.innerHTML = hits.length ? hits.map((p,i) => `<button role="option" class="${i===0?'active':''}" data-id="${p.id}">${esc(p.name)}<small>${esc(p.title)}</small></button>`).join('')
    : `<div style="padding:10px 12px;color:var(--muted)">No one matches “${esc(q.value)}”. Try a last name or a word from the title.</div>`;
  res.classList.add('open');
  res.querySelectorAll('button').forEach(b => b.onclick = () => pick(b.dataset.id));
}
function pick(id){ res.classList.remove('open'); q.value=''; q.blur(); select(id, true); }
q.addEventListener('input', doSearch);
q.addEventListener('keydown', e => {
  const btns = res.querySelectorAll('button');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if(!btns.length) return; btns[hi]?.classList.remove('active'); hi = (hi + (e.key==='ArrowDown'?1:-1) + btns.length) % btns.length; btns[hi].classList.add('active'); btns[hi].scrollIntoView({block:'nearest'}); }
  if (e.key === 'Enter' && hits[hi]) { e.preventDefault(); pick(hits[hi].id); }
  if (e.key === 'Escape'){ res.classList.remove('open'); q.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){ e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && selected && document.activeElement.tagName !== 'INPUT'){ selected = null; renderPanel(); render(); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search')) res.classList.remove('open');
  if (!e.target.closest('.menu')) { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
});

/* ---------- filters & stats ---------- */
const strip = document.getElementById('strip');
FUNCS.forEach(([f, v]) => {
  const n = PEOPLE.filter(p => p.fn === f).length; if (!n) return;
  const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed','true');
  b.innerHTML = `<i style="background:var(${v})"></i>${f} <b>${n}</b>`;
  b.onclick = () => { activeFns.has(f) ? activeFns.delete(f) : activeFns.add(f); if (!activeFns.size) FUNCS.forEach(x => activeFns.add(x[0])); syncChips(); render(); };
  b.dataset.f = f; strip.appendChild(b);
});
function syncChips(){ strip.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', activeFns.has(c.dataset.f))); }
const stats = document.createElement('div'); stats.className = 'stats'; strip.appendChild(stats);
function updateStats(){
  const leaders = PEOPLE.filter(p => LEVELS.indexOf(p.level) <= 3).length;
  stats.innerHTML = `<span><strong>${PEOPLE.length}</strong> people</span><span><strong>${leaders}</strong> Director and above</span><span class="dotkey">Already talking to</span>`;
}

/* ---------- toolbar ---------- */
const menu = document.getElementById('menu'), menuBtn = document.getElementById('menuBtn');
menuBtn.onclick = () => { const o = menu.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', o); };
document.getElementById('leaders').onclick = () => { leadersOnly(); render(); fit(); };
document.getElementById('expand').onclick = () => { collapsed.clear(); render(); fit(); };
document.getElementById('collapse').onclick = () => { setDefaultCollapse(); render(); fit(); };
document.getElementById('fit').onclick = fit;
document.getElementById('zin').onclick = () => svg.transition().duration(reduce?0:200).call(zoom.scaleBy, 1.25);
document.getElementById('zout').onclick = () => svg.transition().duration(reduce?0:200).call(zoom.scaleBy, 0.8);
svg.on('click', () => { if (selected){ selected = null; renderPanel(); render(); } });

function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
document.getElementById('exportCsv').onclick = () => {
  const rows = [['Name','Job title','Function','Seniority','Reports to','Location','LinkedIn','Notes']];
  PEOPLE.forEach(p => { const par = parentOf(p.id); rows.push([p.name,p.title,p.fn,p.level,par?byId[par].name:'',p.city,p.li,get(p.id,'note')||'']); });
  download('ingram-micro-power-map.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv'); menu.classList.remove('open');
};
document.getElementById('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('powermap:theme', r.dataset.theme); } catch(e) {}
  menu.classList.remove('open');
};
try { const th = localStorage.getItem('powermap:theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- start ---------- */
// seed relationship data as defaults
PEOPLE.forEach(p => { p.status = p.status || ''; p.note = p.note || ''; });
setDefaultCollapse(); render(); updateStats();
requestAnimationFrame(() => {
  const c = document.getElementById('canvas').getBoundingClientRect(), k = c.width < 760 ? 0.6 : 0.75;
  svg.call(zoom.transform, d3.zoomIdentity.translate(24, c.height/2).scale(k));
});
</script>
</body>
</html>
